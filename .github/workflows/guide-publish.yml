name: Guide publish

# Runs when you press APPROVE in the Franklin guide proof email. The Cloudflare Worker verifies the signed link and triggers this.
# It marks the page (or all pages) as approved for Google, then redeploys the site.
on:
  repository_dispatch:
    types: [guide-publish]

permissions:
  contents: write
  actions: write

concurrency:
  group: guide-${{ github.event.client_payload.slug }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLUG: ${{ github.event.client_payload.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the slug
        run: |
          case "$SLUG" in (''|*[!a-z0-9-]*) echo "Bad slug"; exit 1;; esac
      - name: Approve for Google
        run: node scripts/guide/set-approved.mjs "$SLUG"
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "the615agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/franklin-approved
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Guide: approved $SLUG for Google"
          # Several approvals can arrive at once: retry the push until it goes through.
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q && git push -q && break
            echo "push retry $i"; sleep $((RANDOM % 6 + 3))
          done
          git status -sb | head -1
          gh workflow run deploy.yml --ref main
