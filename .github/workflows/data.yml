name: Update market data

on:
  schedule:
    - cron: '0 12 4 * *'   # the 4th of every month, about 7am Central
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 'Re-download Redfin, FRED and Zillow reviews first (turn off to only redo the commentary)'
        type: boolean
        default: true
      create_report_draft:
        description: 'Also create this month\'s report as a draft in Buttondown'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh market data (Redfin + FRED)
        if: github.event.inputs.refresh_data != 'false'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/data/update-market.mjs
      - name: Refresh Zillow reviews (Bridge)
        if: github.event.inputs.refresh_data != 'false'
        env:
          BRIDGE_API_TOKEN: ${{ secrets.BRIDGE_API_TOKEN }}
        run: node scripts/data/reviews.mjs
      - name: Write market commentary (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/data/commentary.mjs
      - name: Commit changes
        id: commit
        run: |
          git config user.name "the615agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else
            git commit -m "Monthly market data update"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the monthly report draft (Buttondown)
        if: github.event_name == 'schedule' || github.event.inputs.create_report_draft == 'true'
        continue-on-error: true
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: node scripts/data/report-draft.mjs
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
