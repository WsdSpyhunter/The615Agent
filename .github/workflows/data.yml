name: Update market data

on:
  schedule:
    - cron: '0 12 4 * *'   # the 4th of every month, about 7am Central
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh market data (Redfin + FRED)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/data/update-market.mjs
      - name: Refresh Zillow reviews (Bridge)
        env:
          BRIDGE_API_TOKEN: ${{ secrets.BRIDGE_API_TOKEN }}
        run: node scripts/data/reviews.mjs
      - name: Commit changes
        id: commit
        run: |
          git config user.name "the615agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else
            git commit -m "Monthly market data update"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
