name: Explore Bridge reviews

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/data/bridge-discover.mjs
        env:
          BRIDGE_API_TOKEN: ${{ secrets.BRIDGE_API_TOKEN }}
