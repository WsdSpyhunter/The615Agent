name: Buttondown check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          curl -s -H "Authorization: Token $K" "https://api.buttondown.com/v1/emails?ordering=-creation_date" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const d=JSON.parse(s);console.log('EMAILS',d.count);for(const x of (d.results||[]).slice(0,10))console.log('E '+JSON.stringify({subject:x.subject,status:x.status,created:x.creation_date}))}catch{console.log('ERR',s.slice(0,300))}})"
