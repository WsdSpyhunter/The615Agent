name: Buttondown inspect
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          ID=$(curl -s -H "Authorization: Token $K" https://api.buttondown.com/v1/newsletters | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s).results;console.log(r.length===1?r[0].id:'')})")
          if [ -z "$ID" ]; then echo "RESULT: could not identify exactly one newsletter, stopping"; exit 0; fi
          CSS='.email-preamble{display:block !important;width:100% !important;margin:0 auto !important;padding-left:0 !important;padding-right:0 !important;text-align:center !important}'
          CODE=$(curl -s -o /tmp/out.json -w "%{http_code}" -X PATCH -H "Authorization: Token $K" -H "Content-Type: application/json" --data "{\"css\":\"$CSS\"}" "https://api.buttondown.com/v1/newsletters/$ID")
          echo "RESULT: PATCH http $CODE"
          node -e "const j=require('/tmp/out.json');console.log('RESULT: css now =',JSON.stringify(j.css||j.detail||j).slice(0,300))"
