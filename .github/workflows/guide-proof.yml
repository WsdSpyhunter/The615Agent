name: Guide proof email

# Emails you one proof for the Franklin guide (a card and an Approve button per page).
on:
  workflow_dispatch:
  push:
    paths: ['.github/guide-proof-request']

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the site
        run: npx astro build
      - name: Email the proof
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          APPROVAL_EMAIL: ${{ vars.APPROVAL_EMAIL }}
          BLOG_FROM_ADDRESS: ${{ vars.BLOG_FROM_ADDRESS }}
        run: node scripts/guide/send-proof.mjs
